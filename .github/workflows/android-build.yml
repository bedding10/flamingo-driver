# ==========================================================================
# flaminGO Driver — بناء APK لأندرويد
#
# مبني على ما في المستودع فعلياً، لا على افتراضات:
#  • لا يوجد مجلد android/ (مستثنى في .gitignore عمداً) => يولَّد هنا عبر
#    expo prebuild من app.json + app.config.js.
#  • prebuild يولّد build.gradle قياسياً يوقّع release بمفتاح debug العام،
#    وهذا غير مقبول لحزمة توزَّع، لذلك تعيد الخطوة أدناه كتابة آلية التوقيع
#    لتعتمد على متغيرات البيئة ANDROID_KEYSTORE_* ، وتبقى النسخة غير موقّعة
#    إن غابت الأسرار بدل توقيعها بمفتاح debug.
#  • google-services.json متتبَّع في الجذر ومطابق للحزمة com.flamingo.driver،
#    وهو شرط إضافة @react-native-firebase/app.
#  • حزمة JS تُبنى مرة مبكرة (expo export) قبل Gradle: أي وحدة مفقودة تفشل
#    خلال ثوانٍ بدل أربع دقائق داخل createBundleReleaseJsAndAssets.
# ==========================================================================

name: Android APK Build (Driver)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "نوع الحزمة"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      architectures:
        description: "معماريات ABI"
        required: false
        default: "arm64-v8a,armeabi-v7a"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # يقرأها src/config.ts وقت تجميع حزمة JS.
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_SOCKET_URL: ${{ secrets.EXPO_PUBLIC_SOCKET_URL }}
      EXPO_PUBLIC_ENV: ${{ secrets.EXPO_PUBLIC_ENV }}
      # يقرأها app.config.js وقت تقييم إعدادات Expo.
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      # يقرأها build.gradle بعد الترقيع أدناه.
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      npm_config_engine_strict: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build variant
        id: cfg
        run: |
          set -euo pipefail
          VARIANT="${{ github.event.inputs.variant }}"
          VARIANT="${VARIANT:-release}"
          ARCHS="${{ github.event.inputs.architectures }}"
          ARCHS="${ARCHS:-arm64-v8a,armeabi-v7a}"
          if [ "$VARIANT" = "release" ]; then
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
          fi
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "archs=$ARCHS"     >> "$GITHUB_OUTPUT"
          echo "الحزمة المطلوبة: $VARIANT ($ARCHS)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: "npm"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate required secrets
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "${EXPO_PUBLIC_API_URL:-}" ] || MISSING="$MISSING EXPO_PUBLIC_API_URL"
          [ -n "${GOOGLE_MAPS_ANDROID_API_KEY:-}" ] || MISSING="$MISSING GOOGLE_MAPS_ANDROID_API_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::أسرار مفقودة في Settings > Secrets and variables > Actions:$MISSING"
            echo "src/config.ts يرمي استثناء عند غياب EXPO_PUBLIC_API_URL، والخريطة لا تعمل بدون مفتاح Maps."
            exit 1
          fi
          case "$EXPO_PUBLIC_API_URL" in
            https://*) : ;;
            *) echo "::warning::EXPO_PUBLIC_API_URL ليس https — usesCleartextTraffic=false في app.json سيمنع الاتصال." ;;
          esac
          echo "الأسرار الإلزامية موجودة."

      - name: Generate .env from secrets
        run: |
          set -euo pipefail
          {
            echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL"
            [ -n "${EXPO_PUBLIC_SOCKET_URL:-}" ] && echo "EXPO_PUBLIC_SOCKET_URL=$EXPO_PUBLIC_SOCKET_URL"
            [ -n "${EXPO_PUBLIC_ENV:-}" ] && echo "EXPO_PUBLIC_ENV=$EXPO_PUBLIC_ENV"
          } > .env
          echo "تم إنشاء .env بـ $(wc -l < .env) سطر (القيم غير مطبوعة)."

      - name: Verify Firebase config file
        run: |
          set -euo pipefail
          if [ ! -f google-services.json ]; then
            echo "::error::google-services.json غير موجود — إضافة @react-native-firebase/app ستفشل أثناء prebuild."
            exit 1
          fi
          if ! grep -q '"com.flamingo.driver"' google-services.json; then
            echo "::error::google-services.json لا يحتوي على الحزمة com.flamingo.driver."
            exit 1
          fi
          echo "google-services.json موجود ومطابق للحزمة com.flamingo.driver."

      - name: Install npm dependencies
        run: |
          set -euo pipefail
          # package-lock.json يُولَّد محلياً؛ إن تأخر عن package.json يفشل npm ci
          # عمداً (EUSAGE) ونكمل بـ npm install بدل تثبيت شجرة ناقصة بصمت.
          if ! npm ci --no-audit --no-fund; then
            echo "::warning::npm ci فشل (غالباً package-lock.json غير محدَّث) — المتابعة بـ npm install."
            npm install --no-audit --no-fund
          fi

      # ------------------------------------------------------------------
      # بوابة الحل المبكر.
      #
      # فشل البناء مرتين عند :app:createBundleReleaseJsAndAssets بسبب وحدة
      # لا يستطيع Metro حلها (ملف مفقود ثم حزمة npm غير معلنة). تلك المهمة
      # لا تعمل إلا بعد إعداد Gradle كاملاً، أي بعد ~4 دقائق من كل محاولة.
      # expo export يبني نفس الرسم البياني لـ Metro بنفس الإعدادات، فيظهر
      # الخطأ نفسه خلال ثوانٍ. NODE_ENV=production يُسكت أيضاً تحذير
      # expo-constants الذي يظهر في السجل.
      # ------------------------------------------------------------------
      - name: Verify every imported module resolves (fast fail)
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          npx expo export --platform android --output-dir "$RUNNER_TEMP/bundle-check"
          echo "حزمة JS اكتملت — كل مسار مستورد قابل للحل."

      - name: Generate native android project (expo prebuild)
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --clean --no-install
          if [ ! -f android/app/build.gradle ]; then
            echo "::error::prebuild لم يُنتج android/app/build.gradle."
            exit 1
          fi
          PKG=$(grep -m1 'applicationId' android/app/build.gradle || true)
          echo "applicationId المولّد: $PKG"
          case "$PKG" in
            *com.flamingo.driver*) : ;;
            *) echo "::error::اسم الحزمة المولّد لا يطابق com.flamingo.driver."; exit 1 ;;
          esac

      - name: Apply env-driven release signing
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let src = fs.readFileSync(path, 'utf8');

          if (src.includes('ANDROID_KEYSTORE_PATH')) {
            console.log('آلية التوقيع مطبقة مسبقاً — لا تغيير.');
            process.exit(0);
          }

          // 1) تعريفات تُقرأ من البيئة، قبل كتلة android { }
          const defs = [
            "def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')",
            "def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')",
            "def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')",
            "def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')",
            'def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword',
            '',
          ].join('\n');

          const androidBlock = src.indexOf('\nandroid {');
          if (androidBlock === -1) throw new Error('لم يُعثر على كتلة android { }');
          src = src.slice(0, androidBlock + 1) + defs + src.slice(androidBlock + 1);

          // 2) إضافة signingConfigs.release
          const sc = src.indexOf('signingConfigs {');
          if (sc === -1) throw new Error('لم يُعثر على signingConfigs { }');
          const insertAt = sc + 'signingConfigs {'.length;
          const releaseConfig = [
            '',
            '        if (hasReleaseSigning) {',
            '            release {',
            '                storeFile file(releaseKeystorePath)',
            '                storePassword releaseKeystorePassword',
            '                keyAlias releaseKeyAlias',
            '                keyPassword releaseKeyPassword',
            '            }',
            '        }',
          ].join('\n');
          src = src.slice(0, insertAt) + releaseConfig + src.slice(insertAt);

          // 3) نوع release لا يُوقَّع بمفتاح debug إطلاقاً.
          //    عند غياب الأسرار تبقى الحزمة غير موقّعة، وهو الفشل الصادق.
          const before = src;
          src = src.replace(
            /signingConfig signingConfigs\.debug(\s*\n\s*(?:minifyEnabled|shrinkResources|proguardFiles|crunchPngs))/,
            'signingConfig hasReleaseSigning ? signingConfigs.release : null$1',
          );
          if (src === before) {
            console.log('::warning::لم يُستبدل signingConfig في buildTypes.release — تحقق من مخرجات prebuild.');
          }

          fs.writeFileSync(path, src);
          console.log('تم تطبيق آلية التوقيع المعتمدة على متغيرات البيئة.');
          NODE

      - name: Decode release keystore
        if: ${{ github.event.inputs.variant != 'debug' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 غير مضبوط — ستنتج حزمة release غير موقّعة لا يمكن تثبيتها."
            exit 0
          fi
          KS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          chmod 600 "$KS"
          if [ ! -s "$KS" ]; then
            echo "::error::فك تشفير الـ keystore أنتج ملفاً فارغاً — تأكد من base64 -w0."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "تم فك تشفير الـ keystore ($(stat -c%s "$KS") بايت)."

      - name: Report signing mode
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] \
             && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "وضع التوقيع: RELEASE موقّع بمفتاحك الخاص."
          else
            echo "::warning::وضع التوقيع: غير موقّع. أضف ANDROID_KEYSTORE_BASE64 و ANDROID_KEYSTORE_PASSWORD و ANDROID_KEY_ALIAS و ANDROID_KEY_PASSWORD."
          fi

      - name: Verify Google Maps key in manifest
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if grep -q 'com.google.android.geo.API_KEY' "$MANIFEST"; then
            if grep -A1 'com.google.android.geo.API_KEY' "$MANIFEST" | grep -q 'android:value=""'; then
              echo "::error::مفتاح الخرائط فارغ في المانيفست رغم وجود السر — راجع app.config.js."
              exit 1
            fi
            echo "مفتاح الخرائط محقون في المانيفست عبر app.config.js."
          else
            echo "::warning::لا يوجد إدخال com.google.android.geo.API_KEY في المانيفست."
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          ./gradlew ${{ steps.cfg.outputs.task }} \
            --no-daemon \
            --stacktrace \
            --max-workers=4 \
            -PreactNativeArchitectures=${{ steps.cfg.outputs.archs }} \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g"

      - name: Collect and verify APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SHORT_SHA=$(git rev-parse --short HEAD)
          VARIANT="${{ steps.cfg.outputs.variant }}"
          N=0
          while IFS= read -r file; do
            N=$((N+1))
            cp "$file" "artifacts/flaminGO-driver-$VARIANT-$SHORT_SHA-$N.apk"
          done < <(find android/app/build/outputs/apk -name '*.apk' -type f | sort)
          if [ "$N" -eq 0 ]; then
            echo "::error::لم يُنتج البناء أي ملف APK."
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          for apk in artifacts/*.apk; do
            echo "— $apk ($(du -h "$apk" | cut -f1))"
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$apk" || \
                echo "::warning::$apk غير موقّع أو التحقق فشل — لن يُثبَّت على الهاتف."
            fi
          done
          echo "name=flaminGO-driver-$VARIANT-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup secrets from disk
        if: always()
        run: |
          rm -f .env || true
          rm -f "$RUNNER_TEMP/release.keystore" || true
